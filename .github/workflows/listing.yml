# Checks a listing pull request and lands it when the checks pass. Nobody
# reviews a listing by hand: the verdict is the decision.
#
# pull_request_target runs this file and the checker from the default branch,
# never the pull request's copy, so a pull request cannot change the checks it
# is held to. Three jobs, each holding only what it needs:
#   read   a read-only token: the pull request through GitHub's API, as data,
#          and what GitHub says of the listed repository and the author
#   check  nothing at all: the Application's repository cloned, scanned and
#          built with install scripts off, none of it run
#   land   a write token: the verdict landed on the default branch, the pull
#          request merged or closed, the publisher told; it runs nothing but
#          the Registry's own code, on the verdict
name: Listing

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    paths: ['listings/**']

permissions: {}

concurrency:
  group: listing-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out the Registry at its default branch
        uses: actions/checkout@v4
        with:
          path: registry
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Read the pull request through GitHub's API, as data, and ask GitHub about its repository
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
          HEAD_COMMIT: ${{ github.event.pull_request.head.sha }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          mkdir -p "$RUNNER_TEMP/pull-request"
          node registry/pipeline/bin/pull-request.mjs --repository "$REPOSITORY" --number "$NUMBER" --head "$HEAD_COMMIT" \
            --author "$AUTHOR" --out "$RUNNER_TEMP/pull-request"

      - uses: actions/upload-artifact@v4
        with:
          name: pull-request
          path: ${{ runner.temp }}/pull-request/
          retention-days: 7

  check:
    needs: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Clones, scans and builds a stranger's repository: it holds no token and
    # no credentials, and asks GitHub nothing; the read job asked already.
    permissions: {}
    outputs:
      outcome: ${{ steps.check.outputs.outcome }}
    steps:
      - name: Clone the Registry at its default branch, anonymously
        env:
          SOURCE: ${{ github.server_url }}/${{ github.repository }}
          COMMIT: ${{ github.sha }}
        run: |
          git clone --quiet "$SOURCE" registry
          git -C registry -c advice.detachedHead=false checkout --quiet "$COMMIT"

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install the checker
        working-directory: registry/pipeline
        run: npm ci --ignore-scripts --no-audit --no-fund

      - uses: actions/download-artifact@v4
        with:
          name: pull-request
          path: ${{ runner.temp }}/pull-request

      - name: Check the listing
        id: check
        env:
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          read="$RUNNER_TEMP/pull-request"
          node registry/pipeline/bin/check.mjs --root registry --changes "$read/changes.json" --listing "$read/listing.json" \
            --answers "$read/answers.json" --author "$AUTHOR" --out "$RUNNER_TEMP/verdict.json"
          echo "outcome=$(node -e 'process.stdout.write(JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")).outcome)' "$RUNNER_TEMP/verdict.json")" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: verdict
          path: ${{ runner.temp }}/verdict.json
          retention-days: 7

  land:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      # The landing commit is pushed with the REGISTRY_LAND_KEY deploy key: the
      # main branch's ruleset lets deploy keys through, and GitHub's own Actions
      # app cannot be named there, so the job's token alone would be refused.
      - name: Check out the Registry at its default branch
        uses: actions/checkout@v4
        with:
          path: registry
          fetch-depth: 0
          ssh-key: ${{ secrets.REGISTRY_LAND_KEY }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: actions/download-artifact@v4
        with:
          name: verdict
          path: ${{ runner.temp }}/verdict

      - name: Land the verdict on the default branch
        id: land
        working-directory: registry
        env:
          NUMBER: ${{ github.event.pull_request.number }}
          HEAD_COMMIT: ${{ github.event.pull_request.head.sha }}
          BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name "frontier-registry[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --quiet --no-tags origin "+refs/pull/${NUMBER}/head:refs/remotes/pull/head"
          test "$(git rev-parse refs/remotes/pull/head)" = "$HEAD_COMMIT"
          landed="$(bash pipeline/bin/land.sh "$RUNNER_TEMP/verdict/verdict.json" "$NUMBER" "$HEAD_COMMIT" "$BRANCH" | tail -n 1)"
          echo "landed=${landed}" >> "$GITHUB_OUTPUT"

      - name: Tell the publisher
        if: always() && steps.land.outcome != 'skipped'
        working-directory: registry
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.pull_request.number }}
          OUTCOME: ${{ needs.check.outputs.outcome }}
          LANDED: ${{ steps.land.outputs.landed }}
          LAND_OUTCOME: ${{ steps.land.outcome }}
        run: |
          verdict="$RUNNER_TEMP/verdict/verdict.json"
          unlanded=false
          if [ "$OUTCOME" = listed ] || [ "$OUTCOME" = unpublished ]; then
            if [ "$LAND_OUTCOME" != success ]; then unlanded=true; fi
          fi
          if [ "$unlanded" = true ]; then
            printf 'The checks passed, and the change could not land on the Registry (%s). Open the listing pull request again to try once more.\n' \
              "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" > "$RUNNER_TEMP/comment.md"
          else
            node pipeline/bin/say.mjs --verdict "$verdict" --commit "$LANDED" > "$RUNNER_TEMP/comment.md"
          fi
          gh pr comment "$NUMBER" --body-file "$RUNNER_TEMP/comment.md"
          if [ "$OUTCOME" = rejected ] || [ "$unlanded" = true ]; then gh pr close "$NUMBER"; fi
          if [ "$OUTCOME" = unavailable ] || [ "$unlanded" = true ]; then exit 1; fi
